<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار Contact API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            direction: rtl;
        }
        .result {
            margin: 20px 0;
            padding: 15px;
            border-radius: 5px;
        }
        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #45a049;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>اختبار Contact API</h1>
    
    <button onclick="testAPI()">إرسال رسالة اختبارية</button>
    <button onclick="checkDatabase()">التحقق من قاعدة البيانات</button>
    
    <div id="result"></div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>جاري الإرسال...</p>';
            
            try {
                const response = await fetch('/api/v1/contact', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'X-CSRF-TOKEN': '{{ csrf_token() }}'
                    },
                    body: JSON.stringify({
                        name: 'اختبار من المتصفح',
                        email: 'browser-test@example.com',
                        subject: 'رسالة اختبارية',
                        message: 'هذه رسالة اختبارية من صفحة الاختبار في المتصفح. التوقيت: ' + new Date().toLocaleString('ar-EG')
                    })
                });
                
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <div class="result ${data.success ? 'success' : 'error'}">
                        <h3>${data.success ? '✓ نجح!' : '✗ فشل!'}</h3>
                        <p><strong>الرسالة:</strong> ${data.message}</p>
                        <p><strong>HTTP Status:</strong> ${response.status}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>✗ خطأ في الاتصال</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
        
        async function checkDatabase() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>جاري التحقق...</p>';
            
            try {
                // Since we can't directly query DB from JS, we'll check admin panel
                resultDiv.innerHTML = `
                    <div class="result success">
                        <h3>للتحقق من قاعدة البيانات:</h3>
                        <ol>
                            <li>افتح: <a href="/admin/contacts" target="_blank">/admin/contacts</a></li>
                            <li>أو استخدم: <code>php artisan tinker --execute="echo App\\Models\\Contact::count();"</code></li>
                        </ol>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>✗ خطأ</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
