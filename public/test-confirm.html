<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Confirm Dialog</title>
    <style>
        body {
            font-family: 'Cairo', Arial, sans-serif;
            padding: 50px;
            text-align: center;
        }
        .btn {
            padding: 15px 30px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
        }
        .btn-danger {
            background: #ef4444;
            color: white;
        }
    </style>
</head>
<body>
    <h1>اختبار رسالة التأكيد</h1>
    <p>هذا اختبار بسيط لمعرفة إذا كانت رسالة التأكيد تظهر مرة واحدة أو مرتين</p>
    
    <form onsubmit="return confirm('هل أنت متأكد من حذف هذه الرسالة؟');" action="#" method="POST">
        <button type="submit" class="btn btn-danger">
            حذف الرسالة (باستخدام onsubmit)
        </button>
    </form>
    
    <br><br>
    
    <button type="button" class="btn btn-danger" onclick="testConfirm()">
        حذف الرسالة (باستخدام onclick)
    </button>
    
    <script>
        function testConfirm() {
            if (confirm('هل أنت متأكد من حذف هذه الرسالة؟')) {
                alert('تم الموافقة');
            } else {
                alert('تم الإلغاء');
            }
        }
        
        console.log('Test page loaded successfully');
    </script>
</body>
</html>
