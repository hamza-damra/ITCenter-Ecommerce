# Fly.io configuration file
# This ensures Fly.io uses nixpacks instead of Docker

app = "itcenter-ecommerce"
primary_region = "iad"

[build]
  builder = "dockerfile"

[env]
  PORT = "8080"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

